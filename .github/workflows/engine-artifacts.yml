name: engine-artifacts

# Rebuilds the native artifacts from the SAME source snapshot so the shipped
# pair can never drift again:
#   - stdlib.mathc  : host `mathc` compiler over Library/*.math (sources from
#                     Math-Engine-MEP, engine from the vendored copy below)
#   - libmathengine.so : arm64-v8a NDK build (embedded stdlib, API 24)
#
# Engine sources of truth: Main/app/src/main/cpp/mathengine/
# (Core/ + CMakeLists.txt vendored from Math-Engine-MEP; only Library/ is
# pulled from the engine repo at build time).
#
# The consistency check derives struct sizes from the `_Static_assert(sizeof(..))`
# lines in mathc_bin.h, so any future payload-layout drift in the engine breaks
# CI instead of failing silently on devices ("Engine init failed").

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Main/app/src/main/cpp/mathengine/**'
      - 'Main/app/src/main/assets/precompiled/**'
      - '.github/workflows/engine-artifacts.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- Assemble one build tree: vendored engine + .math stdlib sources ----
      - name: Assemble build tree (vendored Core + Library/*.math)
        run: |
          set -eu
          git clone --depth 1 https://github.com/Amit2286658/Math-Engine-MEP.git mep
          mkdir -p buildtree
          cp -r Main/app/src/main/cpp/mathengine/Core            buildtree/Core
          cp    Main/app/src/main/cpp/mathengine/CMakeLists.txt  buildtree/CMakeLists.txt
          cp -r mep/Main/Library                                 buildtree/Library
          ls buildtree/Library | head -20
          # Vendored engine must be at least as new as the .math sources need;
          # print both HEADs for the record.
          echo "vendored engine: $(git log -1 --format='%h %s' -- Main/app/src/main/cpp/mathengine)"
          echo "engine repo HEAD: $(git -C mep log -1 --format='%h %s')"

      # ---- Host build: mathc compiler -> stdlib.mathc (+ embedded header) ----
      - name: Build stdlib.mathc (host)
        working-directory: buildtree
        run: |
          set -eu
          cmake -S . -B build-host -DCMAKE_BUILD_TYPE=Release -DMATH_ENGINE_BUILD_SHARED=OFF
          cmake --build build-host --target myapp -j2
          cmake --build build-host --target mathc -j2
          cmake --build build-host --target stdlib -j2
          ls -l precompiled/stdlib.mathc Core/Headers/stdlib_precompiled.h

      - name: Run engine self-tests (host, informational)
        working-directory: buildtree
        run: |
          ./build-host/myapp || echo "WARN: cmath_suite reported failures (see log above)"

      # ---- Consistency check of the generated .mathc ----
      # Checks: magic/version, payload formula (sizes from _Static_asserts),
      # file length, caps, FNV-1a checksum, and intrinsic-table hash.
      - name: Consistency check stdlib.mathc
        working-directory: buildtree
        run: python3 "$GITHUB_WORKSPACE/.github/workflows/check_mathc.py" precompiled/stdlib.mathc

      # ---- NDK build: libmathengine.so (arm64-v8a, embedded stdlib) ----
      - name: Locate or install Android NDK
        run: |
          set -eu
          NDK_DIR="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$NDK_DIR" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" > /dev/null
            NDK_DIR="$ANDROID_HOME/ndk/27.0.12077973"
          fi
          echo "using NDK: $NDK_DIR"
          echo "NDK_DIR=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Build libmathengine.so (arm64-v8a, embedded stdlib)
        working-directory: buildtree
        run: |
          set -eu
          cmake -S . -B build-ndk \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_DIR/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DMATH_ENGINE_BUILD_SHARED=ON
          cmake --build build-ndk --target mathengine -j2
          mkdir -p dist/arm64-v8a
          cp build-ndk/libmathengine.so dist/arm64-v8a/libmathengine.so
          ls -l dist/arm64-v8a/libmathengine.so

      - name: Verify JNI exports in built .so
        working-directory: buildtree
        run: |
          set -eu
          SO=dist/arm64-v8a/libmathengine.so
          N="$(strings -t d "$SO" | grep -o 'Java_com_mathengine_MathEngineBridge_native[A-Za-z_0-9]*' | sort -u | wc -l)"
          echo "JNI symbols exported: $N"
          [ "$N" -ge 23 ] || { echo "ERROR: expected >=23 Java_com_mathengine_MathEngineBridge_native* symbols"; exit 1; }
          # Embedded stdlib must be present (boot path 2/3 rely on it)
          grep -q "MTHC" "$SO" 2>/dev/null || {
            dd if="$SO" of=/tmp/mthc.bin bs=4096 2>/dev/null
            grep -q "MTHC" /tmp/mthc.bin
          }

      # ---- Package ----
      - name: Collect artifacts + sha256
        run: |
          set -eu
          mkdir -p dist
          cp buildtree/precompiled/stdlib.mathc  dist/stdlib.mathc
          sha256sum dist/stdlib.mathc dist/arm64-v8a/libmathengine.so > dist/engine.sha256
          cat dist/engine.sha256
          # Info: does the freshly built stdlib match the asset committed in the repo?
          if cmp -s dist/stdlib.mathc Main/app/src/main/assets/precompiled/stdlib.mathc; then
            echo "stdlib.mathc is byte-identical to the committed asset"
          else
            echo "NOTE: freshly built stdlib.mathc differs from committed asset (sizes follow)"
            ls -l dist/stdlib.mathc Main/app/src/main/assets/precompiled/stdlib.mathc
          fi
          # Verify the .so's embedded stdlib equals the fresh stdlib.mathc
          OFF="$(strings -t d dist/arm64-v8a/libmathengine.so | awk '$2=="MTHC"{print $1; exit}')"
          if [ -n "$OFF" ]; then
            SZ="$(stat -c%s dist/stdlib.mathc)"
            dd if=dist/arm64-v8a/libmathengine.so bs=1 skip="$OFF" count="$SZ" of=/tmp/embedded.mathc 2>/dev/null
            if cmp -s /tmp/embedded.mathc dist/stdlib.mathc; then
              echo "embedded stdlib in .so == fresh stdlib.mathc (consistent pair)"
            else
              echo "ERROR: embedded stdlib in .so differs from fresh stdlib.mathc!"
              exit 1
            fi
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: engine-artifacts
          path: |
            dist/stdlib.mathc
            dist/arm64-v8a/libmathengine.so
            dist/engine.sha256
          if-no-files-found: error
