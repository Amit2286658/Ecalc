name: engine-artifacts

# Rebuilds the native artifacts from the SAME source snapshot so the shipped
# pair can never drift again:
#   - stdlib.mathc  : NOT rebuilt here. The committed 252,076-byte asset in
#                     Main/app/src/main/assets/precompiled/ is the artifact;
#                     CI only validates it (check_mathc.py) and seats it into
#                     the build tree for the self-test suite. (Rebuilding it
#                     from the engine repo's Library/*.math used to ship a
#                     stale image on every run.)
#   - libmathengine.so : arm64-v8a NDK build (API 24) — blank-boot engine (no
#                        embedded stdlib; hosts load stdlib.mathc)
#
# Engine sources of truth: Main/app/src/main/cpp/mathengine/
# (Core/ + CMakeLists.txt vendored from Math-Engine-MEP; only Library/ is
# pulled from the engine repo at build time).
#
# The consistency check derives struct sizes from the `_Static_assert(sizeof(..))`
# lines in mathc_bin.h, so any future payload-layout drift in the engine breaks
# CI instead of failing silently on devices ("Engine init failed").

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Main/app/src/main/cpp/mathengine/**'
      - 'Main/app/src/main/assets/precompiled/**'
      - '.github/workflows/engine-artifacts.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- Assemble one build tree: vendored engine + .math stdlib sources ----
      - name: Assemble build tree (vendored Core + Library/*.math)
        run: |
          set -eu
          mkdir -p buildtree
          cp -r Main/app/src/main/cpp/mathengine/Core            buildtree/Core
          cp    Main/app/src/main/cpp/mathengine/CMakeLists.txt  buildtree/CMakeLists.txt
          cp -r Main/app/src/main/cpp/mathengine/tools           buildtree/tools
          if [ -d Main/app/src/main/cpp/mathengine/Library ] && [ -d Main/app/src/main/cpp/mathengine/Test ]; then
            cp -r Main/app/src/main/cpp/mathengine/Library       buildtree/Library
            cp -r Main/app/src/main/cpp/mathengine/Test          buildtree/Test
          else
            git clone --depth 1 https://github.com/Amit2286658/Math-Engine-MEP.git mep
            cp -r mep/Main/Library                               buildtree/Library
            cp -r mep/Main/Test                                  buildtree/Test
          fi
          # Seat the COMMITTED stdlib asset into the build tree (no rebuild):
          # the host myapp self-test suite loads it via MEP_TEST_STDLIBC_PATH.
          mkdir -p buildtree/precompiled
          cp Main/app/src/main/assets/precompiled/stdlib.mathc   buildtree/precompiled/stdlib.mathc
          sha256sum buildtree/precompiled/stdlib.mathc
          ls buildtree/Library | head -20
          # Vendored engine must be at least as new as the .math sources need;
          # print both HEADs for the record.
          echo "vendored engine: $(git log -1 --format='%h %s' -- Main/app/src/main/cpp/mathengine)"
          if [ -d mep ]; then echo "engine repo HEAD: $(git -C mep log -1 --format='%h %s')"; fi

      # ---- Host build: self-test suite only (stdlib.mathc is NOT rebuilt) ----
      - name: Configure host build (self-tests; stdlib not regenerated)
        working-directory: buildtree
        run: |
          set -eu
          cmake -S . -B build-host -DCMAKE_BUILD_TYPE=Release -DMATH_ENGINE_BUILD_SHARED=OFF
          ls -l precompiled/stdlib.mathc

      - name: Run engine self-tests (host, informational)
        working-directory: buildtree
        run: |
          if cmake --build build-host --target myapp -j2; then
            ./build-host/myapp || echo "WARN: cmath_suite reported failures (see log above)"
          else
            echo "WARN: could not build myapp (test sources; see log above)"
          fi

      # ---- Consistency check of the COMMITTED .mathc asset ----
      # Checks: magic/version, payload formula (sizes from _Static_asserts),
      # file length, caps, FNV-1a checksum, and intrinsic-table hash.
      - name: Consistency check stdlib.mathc (committed asset)
        run: |
          set -eu
          python3 "$GITHUB_WORKSPACE/.github/workflows/check_mathc.py" \
            Main/app/src/main/assets/precompiled/stdlib.mathc
          # Vendored snapshot must stay in parity with the shipped asset.
          if cmp -s Main/app/src/main/assets/precompiled/stdlib.mathc \
                   Main/app/src/main/cpp/mathengine/precompiled/stdlib.mathc; then
            echo "OK: committed asset == vendored precompiled snapshot"
          else
            echo "ERROR: vendored snapshot drifted from committed asset"; exit 1
          fi

      # ---- NDK build: libmathengine.so (arm64-v8a, blank-boot engine) ----
      # Uses the vendored build script: the .so carries NO stdlib image and
      # no MTHC constants; stdlib.mathc ships alongside it in the APK and is
      # loaded at boot (nativeCreateBlank + nativeLoadMathc).
      # Pairing .so <-> stdlib.mathc is guaranteed by this same build tree.
      - name: Locate or install Android NDK
        run: |
          set -eu
          NDK_DIR="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$NDK_DIR" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" > /dev/null
            NDK_DIR="$ANDROID_HOME/ndk/27.0.12077973"
          fi
          echo "using NDK: $NDK_DIR"
          echo "NDK_DIR=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Build libmathengine.so (arm64-v8a, separate stdlib, API 24)
        working-directory: buildtree
        run: |
          set -eu
          sh tools/build_android_arm64.sh "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p dist/arm64-v8a
          cp precompiled/arm64-v8a/libmathengine.so dist/arm64-v8a/libmathengine.so
          ls -l dist/arm64-v8a/libmathengine.so

      - name: Verify built .so
        working-directory: buildtree
        run: |
          set -eu
          SO=dist/arm64-v8a/libmathengine.so
          N="$(strings -t d "$SO" | grep -o 'Java_com_mathengine_MathEngineBridge_native[A-Za-z_0-9]*' | sort -u | wc -l)"
          echo "JNI symbols exported: $N"
          [ "$N" -ge 19 ] || { echo "ERROR: expected >=19 Java_com_mathengine_MathEngineBridge_native* symbols"; exit 1; }
          # Separate-stdlib build: no MTHC image must be embedded in the .so
          if grep -qa "MTHC" "$SO"; then
            echo "ERROR: found 'MTHC' in .so — stdlib must NOT be embedded (blank-boot engine)"; exit 1
          fi
          echo "OK: no embedded stdlib image in .so (separate strategy)"

      # ---- Package ----
      - name: Collect artifacts + sha256
        run: |
          set -eu
          mkdir -p dist/arm64-v8a
          # stdlib.mathc ships the COMMITTED asset (byte-for-byte) — CI no
          # longer regenerates it, so dist can never regress to a stale image.
          cp Main/app/src/main/assets/precompiled/stdlib.mathc         dist/stdlib.mathc
          cp buildtree/dist/arm64-v8a/libmathengine.so  dist/arm64-v8a/libmathengine.so
          sha256sum dist/stdlib.mathc dist/arm64-v8a/libmathengine.so > dist/engine.sha256
          cat dist/engine.sha256
          # Sanity: what is committed is exactly what ships.
          cmp -s dist/stdlib.mathc Main/app/src/main/assets/precompiled/stdlib.mathc \
            && echo "stdlib.mathc dist == committed asset" \
            || { echo "ERROR: dist copy mismatch"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: engine-artifacts
          path: |
            dist/stdlib.mathc
            dist/arm64-v8a/libmathengine.so
            dist/engine.sha256
          if-no-files-found: error
