name: ui-screenshots

# Boots the debug APK on several emulator device profiles (phone / big phone /
# 7" tablet / 10" tablet + a dark-mode variant) and captures one screenshot per
# ViewPager2 page, uploaded as downloadable artifacts. Lets you eyeball layout
# across screen sizes without owning the hardware.
#
# The engine is compiled for x86_64 in-job (-PmepAbi=x86_64 via gradle/CMake):
# GitHub emulator images are x86_64 and the shipped arm64-only jniLibs .so
# cannot be used there.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Main/**'
      - '.github/workflows/ui-screenshots.yml'

defaults:
  run:
    working-directory: Main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Build debug APK (x86_64 native for the emulator)
        run: |
          chmod +x gradlew
          ok=0
          for i in 1 2 3 4 5; do
            if ./gradlew assembleDebug -PmepAbi=x86_64 --console=plain; then ok=1; break; fi
            echo "gradlew attempt $i failed — retrying in 90s"
            sleep 90
          done
          [ "$ok" = 1 ]

      - uses: actions/upload-artifact@v4
        with:
          name: emulator-debug-apk
          path: Main/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  screenshots:
    needs: build-apk
    # Pinned to 24.04: the ubuntu-26.04 image ships /dev/kvm without the runner
    # user in the kvm group, so the emulator silently falls back to TCG (software
    # emulation), never finishes booting, and adb stays "device offline".
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { profile: pixel_4,     api: 34, dark: no  }   # 5.7" phone, 1080x2280 @440dpi
          - { profile: pixel_6_pro, api: 34, dark: yes }   # 6.7" big phone, dark mode
          - { profile: nexus_7,     api: 30, dark: no  }   # 7" tablet, 1200x1920 @213dpi
          - { profile: nexus_10,    api: 34, dark: no  }   # 10" tablet, 2560x1600 @160dpi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: emulator-debug-apk
          path: apk

      - name: Ensure KVM access (belt-and-braces if the image changes again)
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "::warning::no /dev/kvm on this runner — emulator will be slow (TCG)"
          fi

      - name: Capture screenshots (${{ matrix.profile }}, API ${{ matrix.api }}${{ matrix.dark == 'yes' && ' — dark' || '' }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            cd "$GITHUB_WORKSPACE"
            adb shell cmd uimode night ${{ matrix.dark }}
            APK="$(ls "$GITHUB_WORKSPACE/apk/"*.apk | head -1)"
            adb install -r "$APK"
            adb shell am start -W -n com.ecalc/.LauncherDark
            # generous wait: engine boot + stdlib load + first patch seed
            sleep 15
            mkdir -p "$GITHUB_WORKSPACE/shots"
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/shots/01-home.png"
            # swipe across all six ViewPager2 pages, screenshot each
            W=$(adb shell wm size | sed -n 's/.*: \([0-9]*\)x[0-9]*/\1/p' | tr -d '\r')
            H=$(adb shell wm size | sed -n 's/.*: [0-9]*x\([0-9]*\)/\1/p' | tr -d '\r')
            X1=$((W*8/10)); X2=$((W*12/100)); Y=$((H*62/100))
            for p in 1 2 3 4 5; do
              adb shell input swipe "$X1" "$Y" "$X2" "$Y" 600
              sleep 3
              adb exec-out screencap -p > "$GITHUB_WORKSPACE/shots/0$((p+1))-page$((p+1)).png"
            done
            ls -la "$GITHUB_WORKSPACE/shots"

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.profile }}
          path: shots/*.png
          if-no-files-found: error
